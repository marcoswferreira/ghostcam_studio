name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Pre-generate models and sounds
        run: python main.py --self-test

      - name: Build single-file EXE
        run: |
          pyinstaller --noconfirm --onefile --name GhostCamStudio `
            --collect-binaries mediapipe `
            --hidden-import pygame.mixer `
            --hidden-import mediapipe.tasks.c `
            --add-data "models;models" `
            --add-data "assets;assets" `
            main.py

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GhostCamStudio.exe
          generate_release_notes: true